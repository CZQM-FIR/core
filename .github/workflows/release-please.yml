on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # PAT stored as RELEASE_PLEASE_TOKEN. Do NOT set release-type here —
          # that forces a single-package (".") release and ignores the monorepo
          # config/manifest. Per-package types live in release-please-config.json.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
