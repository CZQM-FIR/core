name: Cloudflare Web Deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/common/**"
      - "packages/db/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/cloudflare-web.yml"
  workflow_dispatch: # manual trigger if needed

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Trigger Cloudflare deploy webhook
        run: curl --fail --silent --show-error -X POST "${{ secrets.CLOUDFLARE_WEB_WEBHOOK }}"
